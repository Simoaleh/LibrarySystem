{% extends "base.html" %}
{% block title %}{{ mode }} Borrower{% endblock %}
{% block content %}
<h1>{{ mode }} Borrower</h1>
<form method="post">
  <label>Full Name
    <input name="name" value="{{ borrower.full_name if borrower else '' }}" required>
  </label>
  <label>Email
    <input name="email" type="email" value="{{ borrower.email if borrower else '' }}">
  </label>
  <label>Phone
    <input name="phone" value="{{ borrower.phone if borrower else '' }}">
  </label>
  <button class="btn" type="submit">Save</button>
  <a class="btn" href="{{ url_for('borrowers') }}">Cancel</a>
  <p class="muted">First/last names are split automatically via NLTK tokenization.</p>
</form>
{% endblock %}
